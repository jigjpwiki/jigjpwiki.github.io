name: Admin isolated checks
on:
  pull_request:
    # Admin prospective tests execute root tests and use their shared fixtures.
    paths: ['tests/**', 'admin/**', '.github/workflows/admin-test.yml', 'lib/**', 'schemas/**']
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin
      - run: npm test --prefix admin
      - run: npm run check --prefix admin
      - run: npm run test:worker --prefix admin
      - run: npx playwright install --with-deps chromium
      - name: Shared CMS browser E2E (mock GitHub only)
        env:
          ADMIN_V7_SCREENSHOTS: ${{ runner.temp }}/admin-v7-screens
        run: npm run test:browser:cms --prefix admin
      - name: Shared CMS screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-v7-screens
          path: ${{ runner.temp }}/admin-v7-screens
          if-no-files-found: ignore
          retention-days: 7
      - name: Advanced and legacy browser E2E (mock GitHub only)
        if: ${{ !cancelled() }}
        run: npm run test:browser:legacy --prefix admin
