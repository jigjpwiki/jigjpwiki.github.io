<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="stylesheet" href="/tokens.css" /><title>jigwiki Admin</title
  ><link rel="stylesheet" href="/app.css" /><link
    rel="stylesheet"
    href="/workbench.css"
  />
  <link rel="stylesheet" href="/design-system.css" />
  <body>
    <a href="#main-content" class="skip-link">本文へ移動</a>
    <header class="app-sidebar">
      <h1>jigwiki Admin</h1>
      <p class="sidebar-caption">編集ワークスペース</p>
      <nav aria-label="管理ナビゲーション" class="cms-navigation">
        <span class="nav-label">ワークスペース</span>
        <a href="#dashboard">ダッシュボード</a><a href="#drafts">下書き</a><a href="#publication">公開状況</a><a href="#history">更新履歴</a><a href="#search">全体検索</a>
        <span class="nav-label">コンテンツ</span>
        <a href="#content/talent">VTuber</a><a href="#content/organization">事務所</a><a href="#content/group">グループ</a><a href="#content/anniversary">記念日</a><a href="#content/event">イベント</a>
        <a href="#content/song">楽曲</a><a href="#content/musicVideo">歌動画</a><a href="#content/video">動画情報</a><a href="#content/karaoke">歌枠</a><a href="#content/performance">歌唱記録</a>
        <a href="#content/product">商品</a><a href="#content/campaign">キャンペーン</a><a href="#content/offer">販売情報</a>
        <details data-owner-only><summary>高度な管理</summary>
          <a href="#masters">VTuber一括編集</a><a href="#organizations">事務所・グループ</a><a href="#anniversaries">記念日</a><a href="#music">音楽</a><a href="#events">イベント</a><a href="#goods">グッズ</a><a href="#workspace">変更内容</a><a href="#submitted">提出済みPR</a><a href="#settings">ユーザー・設定</a>
        </details>
        <a href="#cms" id="simple-cms-link" hidden>コンテンツ管理</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <div class="app-page-header">
        <span>管理 / <strong id="page-title">ダッシュボード</strong></span>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <noscript>管理画面の編集にはJavaScriptが必要です。</noscript>
      <section id="login">
        <h2>管理者ログイン</h2>
        <p>
          招待済みのアカウントでログインしてください。
        </p>
        <div class="button-group">
          <a class="button" href="/auth/login">GitHubでログイン</a>
          <a class="button" id="google-login" href="/auth/google/login" hidden>Googleでログイン</a>
        </div>
      </section>
      <section id="app" hidden>
        <div class="identity-bar">
          <p id="identity"></p>
          <button id="logout">ログアウト</button>
        </div>
        <div id="view"></div>
      </section>
    </main>
    <script src="/goods-core.js" defer></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
