<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タレント一覧｜じぐじゅーる</title>
<meta name="description" content="jig.jp関連VTuberのプロフィール・配信・記念日を探せます。">
<link rel="canonical" href="https://www.jigdule.jp/talents/">
<link rel="icon" href="/assets/favicon-32x32.png">
<link rel="stylesheet" href="/assets/talents.css">
<link rel="stylesheet" href="/assets/navigation.css"><link rel="stylesheet" href="/assets/browse.css"><link rel="stylesheet" href="/assets/talent-ux.css">
</head>
<body>
<header><a class="brand" href="/" aria-label="じぐじゅーる 配信スケジュール"><img src="/assets/logo.png" alt="じぐじゅーる" width="160" height="58"></a><!-- jigdule:navigation --></header>
<main id="main-content" class="talent-directory">
<h1>タレント一覧</h1>
<p class="intro">名前や所属からタレントを探す。</p>
<form id="talent-filters" class="browse-filters" hidden role="search" aria-label="タレントを探す">
<label class="directory-search">名前・別名<span class="directory-search-field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="talent-search" type="search" placeholder="名前・別名で検索" autocomplete="off"></span></label>
<label>事務所<select id="talent-organization"><option value="">すべて</option></select></label>
<label>グループ<select id="talent-group"><option value="">すべて</option></select></label>
<label>所属の区分<select id="talent-relation"><option value="">すべて</option><option value="current">現在所属</option><option value="former">旧所属</option><option value="unaffiliated">無所属</option><option value="unknown">所属不明</option></select></label><label>活動状態<select id="talent-activity"><option value="">すべて</option><option value="active">活動中</option><option value="hiatus">活動休止</option><option value="ended">活動終了</option><option value="retired">引退</option><option value="unknown">未確認</option></select></label><label title="事務所別の順序は所属開始日・デビュー日を基準にしています">並び順<select id="talent-sort"><option value="agency">事務所別・加入順</option><option value="name">名前順</option><option value="registered">登録順</option></select></label><button type="reset">条件を解除</button></form>
<div class="directory-results-bar"><p id="talent-count" role="status" aria-live="polite"></p><nav id="directory-jumps" aria-label="所属別一覧へ移動" hidden></nav></div><p id="talent-empty" class="empty-state" hidden>該当するタレントはいません。検索語や条件を変更してください。</p><noscript><p>すべての登録タレントを表示しています。検索と絞り込みにはJavaScriptが必要です。</p></noscript>
<div id="talent-results"><!-- jigdule:talents --></div>

</main>
<footer><a href="/">配信スケジュール</a><a href="/privacy-policy/">プライバシーポリシー</a><a href="/terms/">利用規約</a></footer>
<script src="/assets/js/talents.js" defer></script>
<script src="/assets/js/talent-directory.js" defer></script></body>
</html>
